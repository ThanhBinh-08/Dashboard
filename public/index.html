<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coupon Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="loginForm" class="login-card">
      <div class="brand big"><span class="logo">%</span> Coupon Dashboard</div>
      <label>Tên đăng nhập<input name="username" autocomplete="username" required></label>
      <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label>
      <div class="err" id="loginErr"></div>
      <button class="btn primary block">Đăng nhập</button>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="logo">%</span> Coupon Dashboard</div>
      <div class="domain-pick">
        <label>Domain</label>
        <select id="domainSel"></select>
      </div>
      <nav id="nav"></nav>
      <div class="me">
        <div><b id="meName"></b><small id="meRole"></small></div>
        <button class="link" id="pwBtn">Đổi mật khẩu</button>
        <button class="link" id="logoutBtn">Đăng xuất</button>
      </div>
    </aside>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
    <main class="main" id="view"></main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
